<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Estoque de seminovos | Vehicle Store</title>
<meta name="description" content="Veja todos os seminovos disponíveis na Vehicle Store. Filtre por marca, modelo, câmbio, combustível, carroceria, preço e ano.">
<meta name="theme-color" content="#0B1128">
<link rel="icon" type="image/png" href="assets/img/logo.png">
<meta property="og:type" content="website">
<meta property="og:locale" content="pt_BR">
<meta property="og:site_name" content="Vehicle Store">
<meta property="og:title" content="Estoque de seminovos | Vehicle Store">
<meta property="og:description" content="Veja todos os seminovos disponíveis na Vehicle Store. Filtre por marca, modelo, câmbio, combustível, carroceria, preço e ano.">
<meta property="og:image" content="assets/img/og-image.jpg">
<meta name="twitter:card" content="summary_large_image">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito+Sans:opsz,wght@6..12,400;6..12,600;6..12,700&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body data-page="estoque">
<main id="conteudo">
<section class="page-head"><div class="container">
  <span class="eyebrow">Escolha seu próximo capítulo</span>
  <h1>Nosso estoque<span class="dot">.</span></h1>
  <p>Encontre o carro que combina com sua vida e seu próximo destino.</p>
</div></section>
<section class="area-soft">
  <div class="container stock-layout">
    <div class="drawer-overlay filters-overlay" id="filtros-overlay"></div>
    <aside class="filters" id="filtros" aria-label="Filtros do estoque">
      <form id="filtros-form">
        <div class="fhead">
          <h2><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg> Encontre seu carro</h2>
          <div style="display:flex;gap:12px;align-items:center"><button type="button" id="limpar">Limpar</button>
          <button type="button" class="icon-btn drawer-close" id="fechar-filtros" aria-label="Fechar filtros" style="width:36px;height:36px"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg></button></div>
        </div>
        <div class="field"><label for="f-q">O que você procura?</label><input class="input" id="f-q" name="q" placeholder="Marca, modelo ou versão" autocomplete="off"></div>
        <div class="field"><label for="f-marca">Marcas</label><select class="select" id="f-marca"><option value="">Todos</option></select></div>
        <div class="field"><label for="f-modelo">Modelos</label><select class="select" id="f-modelo"><option value="">Todos</option></select></div>
        <div class="field"><label for="f-cambio">Câmbio</label><select class="select" id="f-cambio"><option value="">Todos</option></select></div>
        <div class="field"><label for="f-combustivel">Combustível</label><select class="select" id="f-combustivel"><option value="">Todos</option></select></div>
        <div class="field"><label for="f-carroceria">Carroceria</label><select class="select" id="f-carroceria"><option value="">Todos</option></select></div>
        <div class="field"><span class="label" id="lbl-preco">Preço (R$)</span>
          <div class="row-2"><input class="input" id="f-preco-de" placeholder="De" data-mask="money" inputmode="numeric" aria-labelledby="lbl-preco" aria-label="Preço de"><input class="input" id="f-preco-ate" placeholder="Até" data-mask="money" inputmode="numeric" aria-label="Preço até"></div></div>
        <div class="field"><span class="label" id="lbl-ano">Ano do modelo</span>
          <div class="row-2"><input class="input" id="f-ano-de" placeholder="De" inputmode="numeric" maxlength="4" aria-label="Ano do modelo de"><input class="input" id="f-ano-ate" placeholder="Até" inputmode="numeric" maxlength="4" aria-label="Ano do modelo até"></div></div>
        <button class="btn btn-primary btn-block" type="submit">Filtrar estoque <span class="arrow">→</span></button>
      </form>
      <div class="help"><strong>Precisa de uma mão?</strong><p>Nossa equipe ajuda você a encontrar o carro ideal.</p><a class="link-arrow" data-wa href="#">Fale com a gente ↗</a></div>
    </aside>

    <div class="stock-main">
      <div class="stock-top">
        <p>Use os filtros para refinar sua busca.</p>
        <button type="button" class="btn btn-outline btn-filters" id="btn-filtros" aria-controls="filtros" aria-expanded="false"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><line x1="21" x2="14" y1="4" y2="4"/><line x1="10" x2="3" y1="4" y2="4"/><line x1="21" x2="12" y1="12" y2="12"/><line x1="8" x2="3" y1="12" y2="12"/><line x1="21" x2="16" y1="20" y2="20"/><line x1="12" x2="3" y1="20" y2="20"/><line x1="14" x2="14" y1="2" y2="6"/><line x1="8" x2="8" y1="10" y2="14"/><line x1="16" x2="16" y1="18" y2="22"/></svg> Filtros</button>
        <label class="sr-only" for="ordem">Ordenar por</label>
        <select class="select" id="ordem">
          <option value="recentes">Mais recentes</option>
          <option value="menor-preco">Menor preço</option>
          <option value="maior-preco">Maior preço</option>
          <option value="menor-km">Menor km</option>
          <option value="ano">Ano mais novo</option>
        </select>
      </div>
      <p class="counter" id="contador" aria-live="polite">&nbsp;</p>
      <div class="grid-cars" id="grid"></div>
      <nav class="pagination" id="paginacao" aria-label="Paginação"></nav>
    </div>
  </div>
</section>
</main>
<script src="data/config.js"></script>
<script src="assets/js/supabase.js"></script>
<script src="assets/js/main.js"></script>
<script src="assets/js/estoque.js"></script>
</body>
</html>
